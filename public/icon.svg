<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1c1917" />
  <!-- Gambian flag inspired accent band -->
  <rect x="56" y="80" width="400" height="12" rx="6" fill="#ce1126" />
  <rect x="56" y="96" width="400" height="16" rx="6" fill="#0c1c8c" />
  <rect x="56" y="116" width="400" height="12" rx="6" fill="#3a7728" />
  
  <!-- Minibus / Transit badge -->
  <g transform="translate(106, 170)">
    <rect x="20" y="40" width="260" height="170" rx="36" fill="#f59e0b" />
    <rect x="40" y="60" width="80" height="65" rx="12" fill="#1c1917" opacity="0.85" />
    <rect x="140" y="60" width="120" height="65" rx="12" fill="#1c1917" opacity="0.85" />
    <!-- Headlights -->
    <circle cx="55" cy="175" r="14" fill="#ffffff" />
    <circle cx="245" cy="175" r="14" fill="#ffffff" />
    <!-- Wheels -->
    <rect x="45" y="195" width="45" height="30" rx="8" fill="#1c1917" />
    <rect x="210" y="195" width="45" height="30" rx="8" fill="#1c1917" />
    <!-- Destination header -->
    <rect x="75" y="20" width="150" height="24" rx="6" fill="#1c1917" />
    <text x="150" y="37" font-family="sans-serif" font-weight="900" font-size="14" fill="#f59e0b" text-anchor="middle">PASSO</text>
  </g>
  <text x="256" y="445" font-family="sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">PASSO FARES</text>
</svg>
